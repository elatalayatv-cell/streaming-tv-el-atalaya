<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Atalaya Tv</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: { 900: '#071525', 800: '#0b1e3a', 700: '#16345e' },
          accent: { 500: '#c9932f', 400: '#e5b95f' }
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
</style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-brand-900 border-r border-gray-800 flex flex-col h-full shrink-0">
    <div class="p-6 flex items-center gap-3 border-b border-gray-800">
      <div class="w-10 h-10 bg-accent-500 rounded-xl flex items-center justify-center text-brand-900">
        <i data-lucide="radio" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">Atalaya Tv</h1>
        <p class="text-xs text-accent-500 font-medium tracking-wide">ADMIN PANEL</p>
      </div>
    </div>
    
    <nav class="flex-1 p-4 space-y-2">
      <button onclick="switchTab('general')" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-accent-500 text-brand-900 font-semibold transition-all">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> General
      </button>
      <button onclick="switchTab('streams')" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all">
        <i data-lucide="signal" class="w-5 h-5"></i> Señales (TV/Radio)
      </button>
      <button onclick="switchTab('redes')" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all">
        <i data-lucide="share-2" class="w-5 h-5"></i> Redes Sociales
      </button>
      <button onclick="switchTab('programas')" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all">
        <i data-lucide="calendar" class="w-5 h-5"></i> Programación
      </button>
    </nav>

    <div class="p-4 border-t border-gray-800">
      <div class="bg-gray-900/50 p-4 rounded-xl">
        <label class="text-xs font-semibold text-gray-400 flex items-center gap-2 mb-2">
          <i data-lucide="lock" class="w-3 h-3"></i> GitHub Token
        </label>
        <input type="password" id="ghToken" placeholder="ghp_..." oninput="localStorage.setItem('gh_token', this.value)" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-accent-500 focus:outline-none transition-all">
        <p class="text-[10px] text-gray-500 mt-2">Solo necesario para guardar.</p>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <!-- HEADER -->
    <header class="h-16 border-b border-gray-800 flex items-center justify-between px-8 bg-gray-950/80 backdrop-blur">
      <h2 class="text-lg font-medium" id="pageTitle">Configuración General</h2>
      <button id="saveBtn" onclick="saveConfig()" class="bg-accent-500 hover:bg-accent-400 text-brand-900 px-6 py-2 rounded-xl font-bold flex items-center gap-2 transition-all shadow-lg shadow-accent-500/20">
        <i data-lucide="save" class="w-4 h-4"></i> Guardar Cambios
      </button>
    </header>

    <!-- SCROLLABLE FORM AREA -->
    <div class="flex-1 overflow-y-auto p-8">
      <div class="max-w-4xl mx-auto">
        
        <!-- TAB: GENERAL -->
        <div id="tab-general" class="tab-content space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div class="glass p-6 rounded-2xl space-y-4">
            <h3 class="text-xl font-semibold mb-4 border-b border-gray-800 pb-2">Información del Sitio</h3>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Nombre del Sitio</label>
              <input type="text" id="siteName" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Eslogan</label>
              <input type="text" id="tagline" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">URL del Logo</label>
              <input type="url" id="logo" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
          </div>
        </div>

        <!-- TAB: STREAMS -->
        <div id="tab-streams" class="tab-content hidden space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div class="glass p-6 rounded-2xl space-y-4">
            <h3 class="text-xl font-semibold mb-4 border-b border-gray-800 pb-2">Enlaces de Transmisión</h3>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">URL de la Radio (Stream MP3)</label>
              <input type="url" id="radioUrl" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">URL de la TV (M3U8)</label>
              <input type="url" id="tvUrl" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
            </div>
          </div>
        </div>

        <!-- TAB: REDES -->
        <div id="tab-redes" class="tab-content hidden space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div class="glass p-6 rounded-2xl space-y-4">
            <h3 class="text-xl font-semibold mb-4 border-b border-gray-800 pb-2">Redes y Contacto</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">WhatsApp (ej: 549299...)</label>
                <input type="text" id="whatsapp" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Facebook</label>
                <input type="url" id="facebook" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Instagram</label>
                <input type="url" id="instagram" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">YouTube</label>
                <input type="url" id="youtube" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">TikTok</label>
                <input type="url" id="tiktok" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-accent-500 focus:outline-none">
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: PROGRAMAS -->
        <div id="tab-programas" class="tab-content hidden space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div class="glass p-6 rounded-2xl space-y-4">
            <h3 class="text-xl font-semibold mb-4 border-b border-gray-800 pb-2">Programación y Bloques (Avanzado)</h3>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Lista de Programas (JSON)</label>
              <textarea id="programas" spellcheck="false" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 h-64 font-mono text-sm focus:ring-2 focus:ring-accent-500 focus:outline-none"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Bloques Musicales (JSON)</label>
              <textarea id="bloques" spellcheck="false" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 h-32 font-mono text-sm focus:ring-2 focus:ring-accent-500 focus:outline-none"></textarea>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-800 border border-gray-700 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50">
    <i data-lucide="check-circle" class="w-5 h-5 text-green-400"></i>
    <span id="toastMsg" class="font-medium text-sm">Cambios guardados</span>
  </div>

<script>
  lucide.createIcons();
  document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

  const REPO = "elatalayatv-cell/streaming-tv-el-atalaya";
  const FILE = "atalaya-config.json";
  const urlApi = `https://api.github.com/repos/${REPO}/contents/${FILE}`;

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.getElementById(`tab-${tabId}`).classList.remove('hidden');
    
    document.querySelectorAll('.tab-btn').forEach(el => {
      el.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-all";
    });
    event.currentTarget.className = "tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-accent-500 text-brand-900 font-semibold transition-all";
    
    const titles = { general: 'Configuración General', streams: 'Señales en Vivo', redes: 'Redes Sociales', programas: 'Programación' };
    document.getElementById('pageTitle').innerText = titles[tabId];
  }

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    const icon = toast.querySelector('svg');
    document.getElementById('toastMsg').innerText = msg;
    if(isError) {
      toast.className = "fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 bg-red-900/90 border border-red-700 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50";
      icon.classList.replace('text-green-400', 'text-red-400');
    } else {
      toast.className = "fixed bottom-6 right-6 transform translate-y-0 opacity-100 transition-all duration-300 bg-gray-800 border border-gray-700 px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50";
      icon.classList.replace('text-red-400', 'text-green-400');
    }
    setTimeout(() => {
      toast.classList.replace('translate-y-0', 'translate-y-20');
      toast.classList.replace('opacity-100', 'opacity-0');
    }, 3000);
  }

  async function cargarConfig() {
    try {
      const res = await fetch('atalaya-config.json?_=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        if(data.general) {
          document.getElementById('siteName').value = data.general.siteName || 'El Atalaya';
          document.getElementById('tagline').value = data.general.tagline || '';
          document.getElementById('logo').value = data.general.logo || '';
        }
        if(data.streams) {
          document.getElementById('radioUrl').value = data.streams.radioUrl || '';
          document.getElementById('tvUrl').value = data.streams.tvUrl || '';
        }
        if(data.redes) {
          document.getElementById('whatsapp').value = data.redes.whatsapp || '';
          document.getElementById('facebook').value = data.redes.facebook || '';
          document.getElementById('instagram').value = data.redes.instagram || '';
          document.getElementById('youtube').value = data.redes.youtube || '';
          document.getElementById('tiktok').value = data.redes.tiktok || '';
        }
        if(data.programas) document.getElementById('programas').value = JSON.stringify(data.programas, null, 2);
        if(data.bloques) document.getElementById('bloques').value = JSON.stringify(data.bloques, null, 2);
      }
    } catch(e) { console.log("No hay config previa."); }
  }

  async function saveConfig() {
    const token = document.getElementById('ghToken').value.trim();
    if(!token) return showToast('Falta el Token de GitHub', true);

    const btn = document.getElementById('saveBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Guardando...';
    btn.disabled = true;

    let newConfig = {
      general: {
        siteName: document.getElementById('siteName').value,
        tagline: document.getElementById('tagline').value,
        logo: document.getElementById('logo').value,
        liveLabel: 'En vivo ahora', newsTitle: 'Últimas noticias', newsSub: 'Cobertura del mundo evangélico.', programsTitle: 'Nuestros Programas'
      },
      streams: {
        radioUrl: document.getElementById('radioUrl').value,
        tvUrl: document.getElementById('tvUrl').value,
        tvPage: 'TV.html'
      },
      redes: {
        whatsapp: document.getElementById('whatsapp').value, whatsappMsg: 'Hola El Atalaya, quisiera consultar...',
        facebook: document.getElementById('facebook').value, instagram: document.getElementById('instagram').value, youtube: document.getElementById('youtube').value, tiktok: document.getElementById('tiktok').value
      },
      programas: [], bloques: []
    };

    try {
      if(document.getElementById('programas').value.trim()) newConfig.programas = JSON.parse(document.getElementById('programas').value);
      if(document.getElementById('bloques').value.trim()) newConfig.bloques = JSON.parse(document.getElementById('bloques').value);
    } catch(err) {
      showToast('Error de sintaxis en el JSON de Programas', true);
      btn.innerHTML = originalText; btn.disabled = false;
      return;
    }

    const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newConfig, null, 2))));

    try {
      let sha = null;
      const getRes = await fetch(urlApi, { headers: { 'Authorization': `token ${token}` } });
      if (getRes.ok) sha = (await getRes.json()).sha;

      const putRes = await fetch(urlApi, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: "Update via Admin Dashboard", content: encodedContent, sha: sha })
      });

      if (putRes.ok) {
        showToast('✅ Cambios guardados correctamente');
      } else {
        throw new Error((await putRes.json()).message || 'Error de credenciales');
      }
    } catch (error) {
      showToast('Error: ' + error.message, true);
    } finally {
      btn.innerHTML = originalText; btn.disabled = false;
    }
  }

  cargarConfig();
</script>
</body>
</html>
