<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EL ATALAYA — Streaming Tv Online</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EL ATALAYA TV">
<style>
:root{
  --bg:#07080d; --bg2:#0d1017; --bg3:#141822; --bg4:#1c2230;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.1);
  --txt:#eef2f9; --muted:#7d8ba4;
  --acc:#ffb020; --acc2:#ff5c33; --live:#ff2d55;
  --r:14px; --r2:11px;
  --sh:0 20px 50px rgba(0,0,0,.5);
  --glow:0 0 40px rgba(255,176,32,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1000px 500px at 10% -10%, rgba(255,176,32,.08), transparent 60%),radial-gradient(800px 500px at 100% 20%, rgba(255,92,51,.06), transparent 60%)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:20px}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(7,8,13,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
.burger{display:none;background:none;border:1px solid var(--line2);color:var(--txt);font-size:18px;width:42px;height:42px;border-radius:11px;cursor:pointer;transition:.2s}
.burger:hover{background:var(--bg3)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:inherit;flex-shrink:0}
.logo{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:var(--glow);overflow:hidden;padding:2px;flex-shrink:0;transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.brand:hover .logo{transform:scale(1.06) rotate(-3deg)}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:11px;display:block}
.brand-txt{font-size:17px;font-weight:800;letter-spacing:.4px;line-height:1}
.brand-txt b{background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:9px;letter-spacing:2.5px;color:var(--muted);margin-top:5px;font-weight:600;display:block}
.search{flex:1;max-width:540px;position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{width:100%;padding:12px 16px 12px 44px;border-radius:12px;border:1px solid var(--line2);background:var(--bg3);color:var(--txt);font-size:14px;outline:none;transition:.25s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,176,32,.1);background:var(--bg2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:8px 14px;border:1px solid var(--line2);border-radius:11px;background:var(--bg3)}
.btn{padding:11px 16px;border-radius:11px;border:1px solid var(--line2);background:var(--bg3);color:var(--txt);font-size:13.5px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--bg4);border-color:rgba(255,255,255,.15)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0d13;border:none;box-shadow:0 8px 24px rgba(255,140,40,.25)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:8px 13px;font-size:12.5px}
.app{display:flex;min-height:calc(100vh - 78px)}
.sidebar{width:260px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px 40px;position:sticky;top:78px;height:calc(100vh - 78px);overflow-y:auto}
.nav-group{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:22px 14px 8px;display:flex;align-items:center;gap:8px}
.nav-group:first-child{margin-top:0}
.nav-item{display:block;width:100%;text-align:left;padding:10px 13px;border-radius:10px;border:none;background:transparent;color:#a4b0c5;font-size:13.5px;cursor:pointer;transition:.15s;font-family:inherit;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--bg3);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(255,176,32,.18),transparent);color:var(--acc);font-weight:700}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.nav-item .count{float:right;color:var(--muted);font-size:11px;font-weight:500;opacity:.7}
.main{flex:1;padding:26px 30px 80px;min-width:0}
.hero{border-radius:22px;padding:38px 36px;margin-bottom:34px;position:relative;overflow:hidden;background:radial-gradient(700px 300px at 15% 0%, rgba(255,176,32,.16), transparent 65%),radial-gradient(600px 300px at 90% 110%, rgba(255,92,51,.14), transparent 60%),linear-gradient(135deg,#101521,#0a0e17);border:1px solid var(--line2)}
.hero::after{content:'';position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,32,.12),transparent 68%);pointer-events:none}
.hero-logo{width:88px;height:88px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(140deg,var(--acc),var(--acc2));box-shadow:var(--glow);overflow:hidden;padding:4px;margin-bottom:22px;position:relative;z-index:2}
.hero-logo img{width:100%;height:100%;object-fit:contain;border-radius:18px;display:block}
.hero h1{font-size:34px;font-weight:900;letter-spacing:-.8px;margin-bottom:10px;position:relative;z-index:2;line-height:1.1}
.hero h1 span{background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14.5px;max-width:640px;line-height:1.65;position:relative;z-index:2}
.hero-stats{display:flex;gap:32px;margin-top:26px;flex-wrap:wrap;position:relative;z-index:2}
.stat b{display:block;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.stat span{font-size:11px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:6px;display:block}
.featured-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:36px}
.fcard{border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);border:1px solid rgba(255,255,255,.08);min-height:170px}
.fcard:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.fcard-tv{grid-row:span 2;min-height:356px;background:linear-gradient(135deg,#7f1d1d 0%,#18181b 100%);border-color:rgba(239,68,68,.3)}
.fcard-tv:hover{box-shadow:0 0 30px rgba(239,68,68,.25)}
.fcard-movies{background:linear-gradient(135deg,#4c1d95 0%,#18181b 100%);border-color:rgba(139,92,246,.3)}
.fcard-movies:hover{box-shadow:0 0 30px rgba(139,92,246,.25)}
.fcard-series{background:linear-gradient(135deg,#0f766e 0%,#18181b 100%);border-color:rgba(20,184,166,.3)}
.fcard-series:hover{box-shadow:0 0 30px rgba(20,184,166,.25)}
.fcard-icon{position:absolute;top:26px;left:26px;width:42px;height:42px;display:grid;place-items:center;opacity:.85}
.fcard-icon svg{width:38px;height:38px;fill:#fff}
.fcard-title{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.02em;text-transform:uppercase;margin-bottom:6px;position:relative;z-index:2}
.fcard-tv .fcard-title{font-size:32px}
.fcard-sub{font-size:13px;color:rgba(255,255,255,.75);font-weight:400;position:relative;z-index:2}
.fcard-count{position:absolute;top:26px;right:26px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);color:#fff;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;z-index:2;border:1px solid rgba(255,255,255,.1)}
@media(max-width:900px){.featured-grid{grid-template-columns:1fr}.fcard-tv{grid-row:span 1;min-height:220px}}
.row{margin-bottom:36px}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.row-head h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:11px}
.row-head h3::before{content:'';width:4px;height:20px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2))}
.more{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;font-weight:600;font-family:inherit;transition:.15s;padding:6px 10px;border-radius:8px}
.more:hover{color:var(--acc);background:var(--bg3)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:240px;gap:14px;overflow-x:auto;padding:4px 2px 16px;scroll-snap-type:x proximity}
.rail .card{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.3,1)}
.poster{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;display:flex;align-items:flex-end;padding:13px;border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.poster::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.9) 100%);z-index:1}
.ptitle{position:relative;font-size:13px;font-weight:800;line-height:1.3;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9);z-index:2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);width:46px;height:46px;border-radius:50%;background:rgba(255,176,32,.95);color:#0a0d13;display:grid;place-items:center;font-size:15px;opacity:.9;z-index:3;padding-left:3px;box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .25s, opacity .25s}
.card .live{position:absolute;top:10px;left:10px;background:var(--live);color:#fff;font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.8px;z-index:3;box-shadow:0 0 16px rgba(255,45,85,.5)}
.card .src-ok{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:#22e07a;box-shadow:0 0 12px #22e07a;z-index:3}
.cmeta{padding:10px 4px 0}
.cmeta h4{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta p{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover) and (pointer:fine){.card:hover{transform:translateY(-5px)}.card:hover .poster{box-shadow:0 20px 42px rgba(0,0,0,.55)}.card:hover .play{transform:translate(-50%,-50%) scale(1);opacity:1}.card .play{opacity:0}}
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(4,6,10,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:22px}
.modal.open{display:flex}
.box{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;width:100%;box-shadow:var(--sh);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.box.player{max-width:1080px}
.box.panel{max-width:900px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);flex-shrink:0}
.mhead .mhead-logo{width:42px;height:42px;border-radius:11px;flex-shrink:0;background:linear-gradient(140deg,var(--acc),var(--acc2));padding:2px;overflow:hidden;display:grid;place-items:center}
.mhead .mhead-logo img{width:100%;height:100%;object-fit:contain;border-radius:9px}
.mhead .mhead-info{flex:1;min-width:0}
.mhead h3{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;margin-top:3px}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:10px;transition:.15s;flex-shrink:0}
.x:hover{background:var(--bg4);color:#fff}
.mbody{padding:0;overflow-y:auto}
.frame{background:#000;aspect-ratio:16/9;width:100%;display:grid;place-items:center;position:relative}
.frame video,.frame iframe{width:100%;height:100%;border:none;display:block;background:#000}
.no-src{text-align:center;padding:38px 26px;color:var(--muted)}
.no-src .ic{font-size:42px;margin-bottom:14px;opacity:.7}
.no-src h4{color:var(--txt);font-size:16px;margin-bottom:8px;font-weight:700}
.no-src p{font-size:13px;line-height:1.6;max-width:440px;margin:0 auto}
.srcbar{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--line);background:var(--bg3);flex-wrap:wrap}
.srcbar input{flex:1;min-width:220px;padding:11px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font-size:13px;outline:none;font-family:inherit}
.srcbar input:focus{border-color:var(--acc)}
.pinfo{padding:16px 22px;font-size:13.5px;color:var(--muted);line-height:1.6}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:22px}
.pgrid h4{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--acc);margin-bottom:16px;font-weight:800}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600}
.field input,.field select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--bg3);color:var(--txt);font-size:13px;outline:none;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--acc)}
.clist{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.citem{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;font-size:12.5px}
.citem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .del{background:none;border:none;color:#ff5b6e;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px}
.pfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:var(--bg3)}
.empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:12px 2px}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,100px);z-index:400;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0d13;padding:13px 24px;border-radius:12px;font-weight:800;font-size:13.5px;opacity:0;transition:.35s cubic-bezier(.2,.8,.3,1);box-shadow:0 16px 44px rgba(0,0,0,.5);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sect-head{margin-bottom:22px}
.sect-head h2{font-size:24px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:12px}
.sect-head p{color:var(--muted);font-size:13px;margin-top:6px}
.foot{margin-top:48px;padding-top:26px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.8;text-align:center}
.foot-logo{width:52px;height:52px;border-radius:13px;margin:0 auto 14px;background:linear-gradient(140deg,var(--acc),var(--acc2));padding:2px;overflow:hidden;display:grid;place-items:center;box-shadow:var(--glow)}
.foot-logo img{width:100%;height:100%;object-fit:contain;border-radius:11px}
.iptv-loading{position:fixed;inset:0;z-index:300;background:rgba(4,6,10,.94);backdrop-filter:blur(10px);display:none;place-items:center;padding:22px}
.iptv-loading.show{display:grid}
.iptv-card{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:38px 44px;max-width:440px;text-align:center;box-shadow:var(--sh)}
.iptv-card .spin{width:60px;height:60px;margin:0 auto 20px;border-radius:50%;border:4px solid rgba(255,176,32,.18);border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iptv-card h3{font-size:18px;font-weight:800;margin-bottom:10px}
.iptv-card p{color:var(--muted);font-size:13px;line-height:1.6}
.iptv-card .bar{margin-top:20px;height:6px;border-radius:4px;background:var(--bg4);overflow:hidden}
.iptv-card .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s;border-radius:4px}
.modal{padding:0}
.box.player{max-width:100vw !important;width:100vw;height:100vh;max-height:100vh !important;border-radius:0 !important;border:none !important}
.box.player .mhead{position:absolute;top:0;left:0;right:0;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);border-bottom:none;padding:18px 22px;pointer-events:none}
.box.player .mhead > *{pointer-events:auto}
.box.player .mbody{height:100vh;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.box.player .frame{width:100%;height:100%;aspect-ratio:auto}
.box.player .srcbar,.box.player .pinfo{display:none !important}
@media(max-width:960px){
  .burger{display:grid;place-items:center}
  .sidebar{position:fixed;left:0;top:78px;z-index:80;transform:translateX(-100%);transition:transform .3s;box-shadow:var(--sh)}
  .sidebar.open{transform:translateX(0)}
  .search{max-width:none}
  .clock{display:none}
  .pgrid{grid-template-columns:1fr}
  .brand-sub{display:none}
}
@media(max-width:640px){
  .topbar{padding:10px 14px;gap:10px}
  .brand-txt{font-size:15px;letter-spacing:.2px}
  .logo{width:42px;height:42px;border-radius:11px}
  .main{padding:18px 16px 60px}
  .hero{padding:26px 22px}
  .hero h1{font-size:23px}
  .hero-logo{width:72px;height:72px;border-radius:18px;margin-bottom:16px}
  .hero-stats{gap:20px}
  .stat b{font-size:20px}
  .btn#btnPanel span{display:none}
  .rail{grid-auto-columns:200px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
  .sidebar{top:70px;height:calc(100vh - 70px)}
  .iptv-card{padding:28px 24px}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="burger" id="burger">☰</button>
  <a class="brand" id="brand">
    <span class="logo"><img src="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png" alt="EL ATALAYA TV"></span>
    <span>
      <span class="brand-txt">EL ATALAYA <b>TV</b></span>
      <span class="brand-sub">STREAMING ONLINE</span>
    </span>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Buscar canales...">
  </div>
  <div class="top-right">
    <span class="clock" id="clock">--:--:--</span>
    <button class="btn" id="btnPanel">⚙ <span>Panel</span></button>
  </div>
</header>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="playerModal">
  <div class="box player">
    <div class="mhead">
      <div class="mhead-logo"><img src="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png" alt="EL ATALAYA TV"></div>
      <div class="mhead-info">
        <h3 id="pTitle">—</h3>
        <small id="pMeta"></small>
      </div>
      <button class="x" data-close>✕</button>
    </div>
    <div class="mbody">
      <div class="frame" id="pFrame"></div>
      <div class="srcbar">
        <input id="pSrc" type="text" placeholder="Pegá la URL del stream: https://...">
        <button class="btn primary" id="pSave">💾 Guardar</button>
        <button class="btn" id="pClear">🗑 Quitar</button>
      </div>
      <div class="pinfo" id="pInfo"></div>
    </div>
  </div>
</div>
<div class="modal" id="panelModal">

<script>
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const hash = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };
const LS = {
  get:(k,d)=>{ try{ return JSON.parse(localStorage.getItem('atalaya_'+k)) ?? d; }catch(e){ return d; } },
  set:(k,v)=>{ try{ localStorage.setItem('atalaya_'+k, JSON.stringify(v)); }catch(e){} }
};
const SOURCES = LS.get('sources', {});
const CUSTOM  = LS.get('custom', []);
const state   = { view:'home', sub:null, q:'' };
let currentItem = null;
const CATALOG = [
  { id:'canales', label:'Canales TV', icon:'📡', subs:[] },
  { id:'personal', label:'Mis Canales', icon:'⭐', subs:[
    { id:'personal-live', label:'⭐ Mis Canales', type:'live', items:[] }
  ]}
];
const INDEX = {};
function buildIndex(){
  for(const k in INDEX) delete INDEX[k];
  CATALOG.forEach(cat => cat.subs.forEach(sub => sub.items.forEach(it => {
    if(!it.id) it.id = slug(it.title) + '-' + sub.id;
    it.type = sub.type;
    it.sub  = sub.id;
    it.cat  = cat.id;
    INDEX[it.id] = it;

}
buildIndex();
function loadCustom(){

      id: 'custom-' + i + '-' + slug(c.title),
      title: c.title,
      meta: 'Canal propio',
      type: 'live'
    };
    subLive.items.push(item);
    SOURCES[item.id] = c.url;

}
loadCustom();
const sidebar = $('#sidebar');
function renderNav(){
  let h = `<button class="nav-item ${state.view==='home'?'active':''}" data-view="home">🏠 Inicio</button>`;
  CATALOG.forEach(cat => {
    const totalCat = cat.subs.reduce((a,s)=>a+s.items.length,0);
    if(!totalCat && cat.id !== 'canales') return;
    h += `<div class="nav-group">${cat.icon} ${esc(cat.label)}</div>`;

sidebar.addEventListener('click', async e => {

  else {
    state.view='sub'; state.sub=item.dataset.sub; state.q='';

    const sub = buscarSub(state.sub);
    if(sub && sub.esLazy && sub.items.length === 0){
      await cargarFeedIndividual(state.sub);

function buscarSub(subId){
  let found = null;
  CATALOG.forEach(c => c.subs.forEach(s => { if(s.id === subId) found = s; }));

}
function posterStyle(it){
  const palettes = [
    ['#1a2130','#283347'],['#221a2a','#362846'],['#1a2422','#283831'],
    ['#28201a','#3e3026'],['#201a28','#302840'],['#281a1c','#40262a'],
    ['#1a242e','#283648'],['#261e2a','#3a2e40'],['#1e2826','#2e3c38'],['#2c1e1e','#422e2e']
  ];
  const [c1, c2] = palettes[ hash(it.title) % palettes.length ];
  return `background:linear-gradient(150deg, ${c1}, ${c2})`;
}
function cardHTML(it){
  const tieneFuente = !!SOURCES[it.id];
  const esIPTV = it.id && it.id.startsWith('iptv-');
  const logo = it.logo
    ? `<img src="${esc(it.logo)}" alt="" loading="lazy" onerror="this.style.display='none'" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:55%;max-height:55%;object-fit:contain;z-index:2;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))">`
    : (esIPTV ? '<span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;opacity:.16;z-index:1">📺</span>' : '');
  return `<article class="card ${it.type}" data-id="${it.id}">
    <div class="poster" style="${posterStyle(it)}">
      ${it.type==='live' ? '<span class="live">● EN VIVO</span>' : ''}

      <span class="ptitle">${esc(it.title)}</span>

    </div>
    <div class="cmeta">
      <h4>${esc(it.title)}</h4>

}
const main = $('#main');
function renderMain(){
  if(state.view === 'search') return renderSearch();
  if(state.view === 'sub')    return renderSub(state.sub);

}
function renderHome(){

  const subMovies = canales.subs.find(s=>s.id==='iptv-movies');
  const subPrivada = canales.subs.find(s=>s.id==='iptv-privada');
  let html = `
  <section class="hero">
    <div class="hero-logo">
      <img src="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png" alt="EL ATALAYA TV">

  <section class="featured-grid">
    <div class="fcard fcard-tv" data-goto="iptv-ar">
      <div class="fcard-icon">
        <svg viewBox="0 0 24 24"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 14H3V8h18v12zM9 10v8l7-4z"/></svg>
      </div>
      <span class="fcard-count">${(subAR?.items.length)||0} canales</span>
      <div class="fcard-title">TV en Vivo</div>
      <div class="fcard-sub">Señal en directo de Argentina</div>

    <div class="fcard fcard-movies" data-goto="iptv-movies">
      <div class="fcard-icon">
        <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zM4 8h16v10H4V8z"/></svg>
      </div>
      <span class="fcard-count">${(subMovies?.items.length)||0} canales</span>

      <div class="fcard-sub">Cine las 24 horas</div>
    </div>
    <div class="fcard fcard-series" data-goto="iptv-privada">
      <div class="fcard-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/></svg>
      </div>
      <span class="fcard-count">⭐ Premium</span>
      <div class="fcard-title">Mi Lista Premium</div>
      <div class="fcard-sub">Películas y series privadas</div>
    </div>
  </section>`;
  CATALOG.forEach(cat => cat.subs.forEach(sub => {
    if(!sub.items.length) return;
    html += `
    <section class="row">
      <div class="row-head">

        <button class="more" data-goto="${sub.id}">Ver todo (${sub.items.length}) →</button>
      </div>
      <div class="rail">${sub.items.slice(0,12).map(cardHTML).join('')}</div>
    </section>`;
  }));
  html += `<div class="foot">
    <div class="foot-logo">
      <img src="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png" alt="EL ATALAYA TV">
    </div>
    EL ATALAYA · Streaming tv

  main.innerHTML = html;
}
function renderSub(subId){
  let sub = null, cat = null;
  CATALOG.forEach(c => c.subs.forEach(s => { if(s.id === subId){ sub = s; cat = c; } }));
  if(!sub) return renderHome();
  main.innerHTML = `
  <div class="sect-head">
    <h2>${cat.icon} ${esc(sub.label)}</h2>
    <p>${sub.items.length} canales disponibles</p>

}
function renderSearch(){
  const q = state.q.trim().toLowerCase();
  const results = Object.values(INDEX).filter(it =>
    it.title.toLowerCase().includes(q) || (it.meta||'').toLowerCase().includes(q)
  );
  main.innerHTML = `
  <div class="sect-head">
    <h2>🔍 Resultados para "${esc(state.q)}"</h2>
    <p>${results.length} coincidencia${results.length===1?'':'s'}</p>

  ${results.length

}
document.addEventListener('click', async e => {
  const card = e.target.closest('.card');
  if(card){ playItem(INDEX[card.dataset.id]); return; }

  if(more){
    state.view='sub'; state.sub = more.dataset.goto; state.q='';

const playerModal = $('#playerModal');
function playItem(it){
  if(!it) return;
  currentItem = it;
  const url = SOURCES[it.id] || '';
  $('#pTitle').textContent = it.title;
  $('#pMeta').textContent  = it.meta || '';
  $('#pInfo').innerHTML = `
    <b>Categoría:</b> ${esc(it.sub)} &nbsp;·&nbsp;
    <b>Estado:</b> ${url ? '<span style="color:#22e07a">fuente configurada</span>'
                         : '<span style="color:#ffb020">sin fuente</span>'}`;
  $('#pSrc').value = url;
  buildPlayer(it, url);
  openModal(playerModal);
}
function buildPlayer(it, url){
  const frame = $('#pFrame');
  frame.innerHTML = '';
  if(!url){
    frame.innerHTML = `
      <div class="no-src">
        <div class="ic">📡</div>
        <h4>Sin fuente configurada</h4>
        <p>Este canal no tiene URL asignada.</p>
      </div>`;
    return;
  }
  const esArchivo = /\.(mp4|webm|ogg|ogv|mov|m3u8|ts|mpd|mkv)(\?.*)?$/i.test(url);
  if(esArchivo){
    const v = document.createElement('video');
    v.controls = true; v.autoplay = true; v.playsInline = true;
    v.setAttribute('controlslist','nodownload');
    frame.appendChild(v);
    if(/\.m3u8(\?.*)?$/i.test(url) && window.Hls && window.Hls.isSupported()){
      const hls = new window.Hls({ lowLatencyMode:true });
      hls.loadSource(url);
      hls.attachMedia(v);
      hls.on(window.Hls.Events.ERROR, (_, d) => {
        if(d.fatal) frame.innerHTML =
          `<div class="no-src"><div class="ic">⚠️</div><h4>No se pudo cargar</h4>
           <p>El canal puede estar caído, bloqueado por región o sin permisos CORS.</p></div>`;
      });
    } else {
      v.src = url;
      v.onerror = () => {
        frame.innerHTML = `<div class="no-src"><div class="ic">⚠️</div>
          <h4>Error al reproducir</h4>
          <p>No se pudo cargar este stream.</p></div>`;
      };
    }
  } else {
    const f = document.createElement('iframe');
    f.src = url;
    f.allowFullscreen = true;
    f.setAttribute('allow','autoplay; fullscreen; encrypted-media; picture-in-picture');
    f.setAttribute('referrerpolicy','no-referrer');
    frame.appendChild(f);
  }
}
$('#pSave').addEventListener('click', () => {

const iptvOverlay = $('#iptvLoading');
const iptvTitle   = $('#iptvTitle');
const iptvMsg     = $('#iptvMsg');
const iptvBar     = $('#iptvBar');
function showIptvOverlay(show){ iptvOverlay.classList.toggle('show', show); }
/* Pre-crear las sub-categorías vacías para feeds lazy */
function initLazySubs(){
  const cat = CATALOG.find(c => c.id === 'canales');
  IPTV_FEEDS.forEach(feed => {
    let sub = cat.subs.find(s => s.id === feed.id);
    if(!sub){
      sub = { id: feed.id, label: feed.label, type: 'live', items: [] };
      cat.subs.push(sub);
    }
    sub.esLazy = !!feed.lazy;
  });
}
initLazySubs();
async function loadIPTVPlaylist(feed, idx, total){
  try{
    iptvTitle.textContent = '📡 Cargando ' + feed.label + '...';
    iptvMsg.textContent = 'Descargando lista... (' + (idx+1) + '/' + total + ')';
    iptvBar.style.width = (idx / total * 100) + '%';
    const res = await fetch(feed.url, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const lines = text.split(/\r?\n|\r/);
    let current = null;
    const items = [];
    const seen  = new Set();
    for(const rawLine of lines){
      const t = rawLine.trim();
      if(!t) continue;
      if(t.startsWith('#EXTINF:')){
        const groupMatch = t.match(/group-title="([^"]*)"/i);
        const nameAttr   = t.match(/tvg-name="([^"]*)"/i);
        const logoAttr   = t.match(/tvg-logo="([^"]*)"/i);
        let name = '';
        if(nameAttr && nameAttr[1].trim()){
          name = nameAttr[1].trim();
        } else {
          let inQuotes = false, lastComma = -1;
          for(let i = 0; i < t.length; i++){
            const ch = t[i];
            if(ch === '"') inQuotes = !inQuotes;
            else if(ch === ',' && !inQuotes) lastComma = i;
          }
          if(lastComma > -1) name = t.substring(lastComma + 1).trim();
        }
        if(/Mozilla|Gecko|AppleWebKit|Chrome\/|Safari\/|Firefox\/|KHTML|like\s*Gecko/i.test(name)) name = '';
        if(name.length > 70) name = name.substring(0, 67) + '...';
        if(!name) name = 'Canal IPTV';
        current = {
          title: name,
          meta: (groupMatch && groupMatch[1]) ? groupMatch[1].trim() : feed.label,
          logo: (logoAttr && logoAttr[1]) ? logoAttr[1].trim() : ''
        };
      } else if(t.startsWith('#')){
        continue;
      } else if(current){
        if(!/^https?:\/\//i.test(t)){ current = null; continue; }
        const key = current.title + '|' + t;
        if(seen.has(key)){ current = null; continue; }
        seen.add(key);
        const id = 'iptv-' + slug(feed.id) + '-' + hash(t).toString(36);
        items.push({ id, title: current.title, meta: current.meta, logo: current.logo || '', type: 'live' });
        SOURCES[id] = t;
        current = null;
      }
    }
    const cat = CATALOG.find(c => c.id === 'canales');
    let sub = cat.subs.find(s => s.id === feed.id);
    if(!sub){
      sub = { id: feed.id, label: feed.label, type: 'live', items: [] };
      cat.subs.push(sub);
    }
    sub.items = items;
    sub.esLazy = !!feed.lazy;
    iptvBar.style.width = ((idx+1) / total * 100) + '%';
    return items.length;
  }catch(err){
    console.error('IPTV error:', feed.label, err);
    return 0;
  }
}
/* Cargar una sola categoría (para lazy) */
async function cargarFeedIndividual(feedId){
  const feed = IPTV_FEEDS.find(f => f.id === feedId);
  if(!feed) return;
  showIptvOverlay(true);
  iptvBar.style.width = '20%';
  const n = await loadIPTVPlaylist(feed, 0, 1);
  iptvBar.style.width = '100%';
  LS.set('sources', SOURCES);
  buildIndex();
  iptvTitle.textContent = '✅ ¡Listo!';
  iptvMsg.textContent = n + ' canales cargados.';
  setTimeout(() => {
    showIptvOverlay(false);
    toast('✅ ' + feed.label + ': ' + n + ' canales');
  }, 600);
}
/* Carga inicial: solo feeds NO lazy */
async function runIPTVLoad(){
  showIptvOverlay(true);
  const feedsCargar = IPTV_FEEDS.filter(f => !f.lazy);
  let totalCargados = 0;
  for(let i=0; i<feedsCargar.length; i++){
    const n = await loadIPTVPlaylist(feedsCargar[i], i, feedsCargar.length);
    totalCargados += n;
  }
  LS.set('sources', SOURCES);
  LS.set('iptv_loaded', true);
  buildIndex();
  renderNav();
  renderMain();
  iptvTitle.textContent = '✅ ¡Listo!';
  iptvMsg.textContent = totalCargados + ' canales cargados.';
  iptvBar.style.width = '100%';
  setTimeout(() => {
    showIptvOverlay(false);
    toast('📡 ' + totalCargados + ' canales cargados');
  }, 900);
}
async function autoLoadIPTV(){
  if(LS.get('iptv_loaded', false)) return;
  await runIPTVLoad();
}
renderNav();
renderMain();
autoLoadIPTV();
// Service Worker para EL ATALAYA TV
const CACHE_NAME = 'atalaya-tv-v2';
const CACHE_FILES = [
  '/streaming-tv-el-atalaya/',
  '/streaming-tv-el-atalaya/index.html',
  '/streaming-tv-el-atalaya/manifest.json'
];

// Instalación: cachear archivos básicos
self.addEventListener('install', (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME)
      .then(cache => cache.addAll(CACHE_FILES))
      .then(() => self.skipWaiting())
  );
});

// Activación: limpiar cachés viejas
self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then(keys => Promise.all(
      keys.map(key => {
        if(key !== CACHE_NAME) return caches.delete(key);
      })
    )).then(() => self.clients.claim())
  );
});

// Fetch: responder desde caché si está disponible
self.addEventListener('fetch', (event) => {
  // No cachear streams ni listas M3U (siempre online)
  const url = event.request.url;
  if(url.endsWith('.m3u8') || url.endsWith('.m3u') || url.includes('iptv-org') || url.includes('raw.githubusercontent')){
    return;
  }

  event.respondWith(
    caches.match(event.request).then(cached => {
      return cached || fetch(event.request).then(response => {
        // Solo cachear respuestas válidas de nuestro origen
        if(response.status === 200 && url.startsWith(self.location.origin)){
          const clone = response.clone();
          caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));
        }
        return response;
      });
    }).catch(() => caches.match('/streaming-tv-el-atalaya/index.html'))
  );
});
