<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EL ATALAYA TV — Streaming Online</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png">
<style>
:root{
  --bg:#080b11; --bg2:#0f141e; --bg3:#161d2b; --bg4:#1e2637;
  --line:#242e42; --txt:#e9eef8; --muted:#8794ab;
  --acc:#ffb020; --acc2:#ff6a3d; --live:#ff2d55;
  --r:14px; --sh:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3549;border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4860}

.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;
  padding:12px 20px;background:rgba(8,11,17,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--txt);
  font-size:18px;width:40px;height:40px;border-radius:10px;cursor:pointer}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:inherit;flex-shrink:0}
.logo{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--acc),var(--acc2));
  box-shadow:0 0 28px rgba(255,176,32,.45);overflow:hidden;padding:2px;flex-shrink:0;transition:transform .25s}
.brand:hover .logo{transform:scale(1.05) rotate(-2deg)}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:11px;display:block}
.brand-txt{font-size:19px;font-weight:800;letter-spacing:1.6px;line-height:1}
.brand-txt b{color:var(--acc)}
.brand-sub{font-size:9.5px;letter-spacing:3px;color:var(--muted);margin-top:5px;font-weight:600;display:block}

.search{flex:1;max-width:520px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{width:100%;padding:11px 14px 11px 41px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg3);color:var(--txt);font-size:14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,176,32,.12)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
  padding:7px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg3)}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);
  color:var(--txt);font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--bg4);border-color:#33415c}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0d13;border:none}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:7px 12px;font-size:12.5px}

.app{display:flex;min-height:calc(100vh - 78px)}
.sidebar{width:250px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
  padding:18px 12px 40px;position:sticky;top:78px;height:calc(100vh - 78px);overflow-y:auto}
.nav-group{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
  font-weight:800;margin:20px 12px 8px;display:flex;align-items:center;gap:8px}
.nav-group:first-child{margin-top:0}
.nav-item{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;border:none;
  background:transparent;color:#b7c2d4;font-size:13.5px;cursor:pointer;transition:.15s;
  font-family:inherit;margin-bottom:2px}
.nav-item:hover{background:var(--bg3);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(255,176,32,.18),transparent);
  color:var(--acc);font-weight:700;box-shadow:inset 3px 0 0 var(--acc)}
.nav-item.live-dot::after{content:'●';color:var(--live);font-size:9px;margin-left:7px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

.main{flex:1;padding:22px 26px 70px;min-width:0}

.hero{border-radius:20px;padding:34px 32px;margin-bottom:30px;position:relative;overflow:hidden;
  background:radial-gradient(900px 320px at 12% 0%, rgba(255,176,32,.20), transparent 62%),
    radial-gradient(700px 320px at 92% 110%, rgba(255,106,61,.20), transparent 60%),
    linear-gradient(120deg,#131a27,#0c111a);
  border:1px solid var(--line)}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,176,32,.14),transparent 68%)}
.hero-logo{width:100px;height:100px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--acc),var(--acc2));
  box-shadow:0 0 45px rgba(255,176,32,.5);overflow:hidden;padding:4px;margin-bottom:20px;
  position:relative;z-index:2;transition:transform .3s}
.hero-logo:hover{transform:scale(1.06) rotate(-2deg)}
.hero-logo img{width:100%;height:100%;object-fit:contain;border-radius:18px;display:block}
.hero h1{font-size:31px;font-weight:900;letter-spacing:-.5px;margin-bottom:9px;position:relative;z-index:2}
.hero h1 span{background:linear-gradient(100deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14.5px;max-width:640px;line-height:1.65;position:relative;z-index:2}
.hero-stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:2}
.stat b{display:block;font-size:23px;color:var(--acc);font-weight:800}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

.row{margin-bottom:36px}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.row-head h3{font-size:17.5px;font-weight:800;display:flex;align-items:center;gap:10px}
.row-head h3::before{content:'';width:4px;height:19px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2))}
.more{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;font-weight:600;font-family:inherit;transition:.15s}
.more:hover{color:var(--acc)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:186px;gap:15px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
.rail .card{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:17px}

.card{cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.card:hover{transform:translateY(-6px)}
.poster{position:relative;border-radius:var(--r);overflow:hidden;display:flex;
  align-items:flex-end;padding:13px;border:1px solid rgba(255,255,255,.07);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.card.vod .poster{aspect-ratio:2/3}
.card.live .poster{aspect-ratio:16/9}
.poster::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.82))}
.ptitle{position:relative;font-size:13.5px;font-weight:800;line-height:1.28;text-shadow:0 2px 10px rgba(0,0,0,.9);z-index:2}
.card.live .ptitle{font-size:12.5px}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
  width:46px;height:46px;border-radius:50%;background:rgba(255,176,32,.94);color:#0a0d13;
  display:grid;place-items:center;font-size:16px;opacity:0;transition:.25s;z-index:3;
  box-shadow:0 8px 24px rgba(0,0,0,.5);padding-left:3px}
.card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.live{position:absolute;top:9px;left:9px;background:var(--live);color:#fff;font-size:9.5px;
  font-weight:800;padding:3.5px 8px;border-radius:6px;letter-spacing:.8px;z-index:3;box-shadow:0 0 14px rgba(255,45,85,.6)}
.src-ok{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#22e07a;box-shadow:0 0 10px #22e07a;z-index:3}
.cmeta{padding:10px 3px 0}
.cmeta h4{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta p{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(4,6,10,.86);backdrop-filter:blur(6px);padding:22px}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:100%;
  box-shadow:var(--sh);animation:pop .25s cubic-bezier(.2,.9,.3,1);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
@keyframes pop{from{transform:scale(.94) translateY(14px);opacity:0}}
.box.player{max-width:1080px}
.box.panel{max-width:880px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:15px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.mhead .mhead-logo{width:42px;height:42px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(140deg,var(--acc),var(--acc2));padding:2px;overflow:hidden;display:grid;place-items:center}
.mhead .mhead-logo img{width:100%;height:100%;object-fit:contain;border-radius:9px}
.mhead .mhead-info{flex:1;min-width:0}
.mhead h3{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;margin-top:3px}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;
  width:34px;height:34px;border-radius:9px;transition:.15s;flex-shrink:0}
.x:hover{background:var(--bg4);color:#fff}
.mbody{padding:0;overflow-y:auto}
.frame{background:#000;aspect-ratio:16/9;width:100%;display:grid;place-items:center;position:relative}
.frame video,.frame iframe{width:100%;height:100%;border:none;display:block;background:#000}
.no-src{text-align:center;padding:34px 26px;color:var(--muted)}
.no-src .ic{font-size:40px;margin-bottom:12px;opacity:.75}
.no-src h4{color:var(--txt);font-size:16px;margin-bottom:7px}
.no-src p{font-size:13px;line-height:1.6;max-width:430px;margin:0 auto}
.srcbar{display:flex;gap:9px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg3);flex-wrap:wrap}
.srcbar input{flex:1;min-width:220px;padding:10px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--txt);font-size:13px;outline:none;font-family:inherit}
.srcbar input:focus{border-color:var(--acc)}
.pinfo{padding:16px 20px;font-size:13.5px;color:var(--muted);line-height:1.6}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:20px}
.pgrid h4{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--acc);margin-bottom:14px;font-weight:800}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg3);color:var(--txt);font-size:13px;outline:none;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--acc)}
.clist{max-height:290px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.citem{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--bg3);
  border:1px solid var(--line);border-radius:9px;font-size:12.5px}
.citem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .del{background:none;border:none;color:#ff5b6e;cursor:pointer;font-size:15px;padding:2px 5px;border-radius:6px}
.citem .del:hover{background:rgba(255,91,110,.14)}
.pfoot{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:var(--bg3)}
.empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:10px 2px}

.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);z-index:400;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0d13;padding:12px 22px;
  border-radius:11px;font-weight:800;font-size:13.5px;opacity:0;transition:.3s;
  box-shadow:0 14px 40px rgba(0,0,0,.5);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.sect-head{margin-bottom:20px}
.sect-head h2{font-size:23px;font-weight:900}
.sect-head p{color:var(--muted);font-size:13px;margin-top:5px}
.foot{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.7;text-align:center}
.foot-logo{width:52px;height:52px;border-radius:13px;margin:0 auto 12px;
  background:linear-gradient(140deg,var(--acc),var(--acc2));padding:2px;overflow:hidden;
  display:grid;place-items:center;box-shadow:0 0 24px rgba(255,176,32,.4)}
.foot-logo img{width:100%;height:100%;object-fit:contain;border-radius:11px}

.iptv-loading{position:fixed;inset:0;z-index:300;background:rgba(4,6,10,.92);backdrop-filter:blur(8px);
  display:none;place-items:center;padding:22px}
.iptv-loading.show{display:grid;animation:fade .25s}
.iptv-card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;
  padding:34px 40px;max-width:420px;text-align:center;box-shadow:var(--sh)}
.iptv-card .spin{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;
  border:4px solid rgba(255,176,32,.18);border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iptv-card h3{font-size:18px;font-weight:800;margin-bottom:8px}
.iptv-card p{color:var(--muted);font-size:13px;line-height:1.6}
.iptv-card .bar{margin-top:18px;height:6px;border-radius:4px;background:var(--bg4);overflow:hidden}
.iptv-card .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .3s;border-radius:4px}

@media(max-width:960px){
  .burger{display:grid;place-items:center}
  .sidebar{position:fixed;left:0;top:78px;z-index:80;transform:translateX(-100%);transition:transform .28s;box-shadow:var(--sh)}
  .sidebar.open{transform:translateX(0)}
  .search{max-width:none}
  .clock{display:none}
  .pgrid{grid-template-columns:1fr}
  .brand-sub{display:none}
}
@media(max-width:640px){
  .topbar{padding:10px 13px;gap:10px}
  .brand-txt{font-size:15px;letter-spacing:1px}
  .logo{width:42px;height:42px;border-radius:11px}
  .main{padding:16px 14px 60px}
  .hero{padding:24px 20px}
  .hero h1{font-size:22px}
  .hero-logo{width:76px;height:76px;border-radius:18px;margin-bottom:14px}
  .btn#btnPanel span,.btn#btnIPTV span{display:none}
  .rail{grid-auto-columns:148px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px}
  .sidebar{top:70px;height:calc(100vh - 70px)}
  .iptv-card{padding:26px 22px}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="burger" id="burger">☰</button>
  <a class="brand" id="brand">
    <span class="logo"><img src="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png" alt="EL ATALAYA TV"></span>
    <span>
      <span class="brand-txt">EL ATALAYA <b>TV</b></span>
      <span class="brand-sub">STREAMING ONLINE</span>
    </span>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Buscar series, películas, canales, deportes...">
  </div>
  <div class="top-right">

</header>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

</div>

<div class="modal" id="playerModal">
  <div class="box player">
    <div class="mhead">
      <div class="mhead-logo"><img src="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png" alt="EL ATALAYA TV"></div>
      <div class="mhead-info">
        <h3 id="pTitle">—</h3>
        <small id="pMeta"></small>
      </div>
      <button class="x" data-close>✕</button>

    <div class="mbody">
      <div class="frame" id="pFrame"></div>
      <div class="srcbar">
        <input id="pSrc" type="text" placeholder="Pegá la URL del stream: https://... (m3u8, mp4 o embed)">

      </div>

</div>

<div class="modal" id="panelModal">
  <div class="box panel">
    <div class="mhead">
      <div class="mhead-logo"><img src="https://i.postimg.cc/KzXFGHjG/Chat-GPT-Image-13-sept-2026-11-02-16.png" alt="EL ATALAYA TV"></div>
      <div class="mhead-info">
        <h3>⚙ Panel de Control — EL ATALAYA TV</h3>
        <small>Agregá tus propios canales y contenidos. Se guardan en este navegador.</small>
      </div>
      <button class="x" data-close>✕</button>
    </div>
    <div class="mbody">
      <div class="pgrid">
        <div>
          <h4>➕ Agregar contenido</h4>
          <div class="field"><label>Nombre</label><input id="cTitle" placeholder="Ej: Canal Local HD"></div>
          <div class="field"><label>Categoría</label><select id="cSub"></select></div>
          <div class="field"><label>URL del stream (m3u8 / mp4 / embed)</label><input id="cUrl" placeholder="https://..."></div>
          <button class="btn primary" id="cAdd" style="width:100%;justify-content:center">Agregar al catálogo</button>

          <h4>📋 Mis contenidos</h4>

    <div class="pfoot">

      <button class="btn sm" id="impBtn">⬆ Importar configuración</button>
      <input type="file" id="impFile" accept=".json" hidden>
      <button class="btn sm" id="resetBtn" style="margin-left:auto;color:#ff5b6e">⟲ Restablecer todo</button>
    </div>

</div>

<div class="iptv-loading" id="iptvLoading">
  <div class="iptv-card">
    <div class="spin"></div>
    <h3 id="iptvTitle">📡 Cargando canales IPTV...</h3>
    <p id="iptvMsg">Descargando listas públicas de canales. Esto puede tardar unos segundos.</p>
    <div class="bar"><i id="iptvBar"></i></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
/* =========================================================
   EL ATALAYA TV — Motor de la aplicación
   ========================================================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const hash = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };
const LS = {
  get:(k,d)=>{ try{ return JSON.parse(localStorage.getItem('atalaya_'+k)) ?? d; }catch(e){ return d; } },
  set:(k,v)=>{ try{ localStorage.setItem('atalaya_'+k, JSON.stringify(v)); }catch(e){} }
};

const SOURCES = LS.get('sources', {});
const CUSTOM  = LS.get('custom', []);
const state   = { view:'home', sub:null, q:'' };
let currentItem = null;

/* =========================================================
   CATÁLOGO
   ========================================================= */
const CATALOG = [
  { id:'series', label:'Series', icon:'📺', subs:[
    { id:'series-50', label:'Series Años 50', type:'vod', items:[
      ["The Twilight Zone","1959 · Ciencia Ficción"],
      ["Perry Mason","1957 · Drama Legal"],
      ["El Zorro","1957 · Aventura"],
      ["Lassie","1954 · Familiar"],
      ["Bonanza","1959 · Western"],

/* Normalizar items (arrays → objetos) */
CATALOG.forEach(cat => cat.subs.forEach(sub => {
  sub.items = sub.items.map(it => Array.isArray(it)
    ? { title: it[0], meta: it[1] || '' }
    : { title: it.title, meta: it.meta || '', id: it.id, type: it.type }
  );
}));

/* =========================================================
   INDEXACIÓN
   ========================================================= */
const INDEX = {};
function buildIndex(){
  for(const k in INDEX) delete INDEX[k];
  CATALOG.forEach(cat => cat.subs.forEach(sub => sub.items.forEach(it => {
    if(!it.id) it.id = slug(it.title) + '-' + sub.id;
    it.type = sub.type;
    it.sub  = sub.id;
    it.cat  = cat.id;
    INDEX[it.id] = it;
  })));
}
buildIndex();

function loadCustom(){
  const subVod  = CATALOG.find(c=>c.id==='personal').subs[0];
  const subLive = CATALOG.find(c=>c.id==='personal').subs[1];
  subVod.items = []; subLive.items = [];
  CUSTOM.forEach((c,i) => {
    const target = c.sub === 'personal-live' ? subLive : subVod;
    const item = {
      id: 'custom-' + i + '-' + slug(c.title),
      title: c.title,
      meta: c.sub === 'personal-live' ? 'Canal propio' : 'Contenido propio',
      type: target.type
    };
    target.items.push(item);
    SOURCES[item.id] = c.url;
  });
  buildIndex();
}
loadCustom();

   ========================================================= */
function posterStyle(it){
  const palettes = [
    ['#161e2e','#243248'], ['#1e1626','#322442'],
    ['#16201e','#243430'], ['#241c16','#3a2c22'],
    ['#1c1624','#2c2438'], ['#241618','#3a2226'],
    ['#16202a','#243244'], ['#221a26','#362a3c'],
    ['#1a2220','#2a3632'], ['#281a1a','#3e2a2a']
  ];
  const [c1, c2] = palettes[ hash(it.title) % palettes.length ];
  return `background:linear-gradient(150deg, ${c1}, ${c2})`;
}

function cardHTML(it){
  const tieneFuente = !!SOURCES[it.id];
  const esIPTV = it.id && it.id.startsWith('iptv-');
  return `<article class="card ${it.type}" data-id="${it.id}">
    <div class="poster" style="${posterStyle(it)}">
      ${it.type==='live' ? '<span class="live">● EN VIVO</span>' : ''}
      ${tieneFuente ? '<span class="src-ok" title="Fuente configurada"></span>' : ''}
      ${esIPTV ? '<span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:38px;opacity:.18;z-index:1">📺</span>' : ''}
      <span class="ptitle">${esc(it.title)}</span>
      <span class="play">▶</span>
    </div>
    <div class="cmeta">
      <h4>${esc(it.title)}</h4>
      <p>${esc(it.meta || '')}</p>
    </div>
  </article>`;
}

   ========================================================= */
const playerModal = $('#playerModal');

function playItem(it){
  if(!it) return;
  currentItem = it;
  const url = SOURCES[it.id] || '';

  $('#pTitle').textContent = it.title;
  $('#pMeta').textContent  = it.meta || '';
  $('#pInfo').innerHTML = `
    <b>Categoría:</b> ${esc(it.sub)} &nbsp;·&nbsp;
    <b>Tipo:</b> ${it.type === 'live' ? 'Señal en vivo' : 'Video on demand'} &nbsp;·&nbsp;
    <b>Estado:</b> ${url ? '<span style="color:#22e07a">fuente configurada</span>'
                         : '<span style="color:#ffb020">sin fuente</span>'}`;
  $('#pSrc').value = url;

  buildPlayer(it, url);
  openModal(playerModal);
}

function buildPlayer(it, url){
  const frame = $('#pFrame');
  frame.innerHTML = '';

  if(!url){
    frame.innerHTML = `
      <div class="no-src">
        <div class="ic">📡</div>
        <h4>Sin fuente configurada</h4>
        <p>Pegá abajo la URL del stream (archivo <b>.m3u8</b>, <b>.mp4</b> o un enlace
           <b>embed/iframe</b>) y presioná <b>Guardar fuente</b>.<br>
           Queda almacenada en este navegador para las próximas visitas.</p>
      </div>`;
    return;
  }

  const esArchivo = /\.(mp4|webm|ogg|ogv|mov|m3u8|ts|mpd)(\?.*)?$/i.test(url);

  if(esArchivo){
    const v = document.createElement('video');
    v.controls = true; v.autoplay = true; v.playsInline = true;
    v.setAttribute('controlslist','nodownload');
    frame.appendChild(v);

    if(/\.m3u8(\?.*)?$/i.test(url) && window.Hls && window.Hls.isSupported()){
      const hls = new window.Hls({ lowLatencyMode:true });
      hls.loadSource(url);
      hls.attachMedia(v);
      hls.on(window.Hls.Events.ERROR, (_, d) => {
        if(d.fatal) frame.innerHTML =
          `<div class="no-src"><div class="ic">⚠️</div><h4>No se pudo cargar el stream</h4>
           <p>Verificá que la URL sea válida y que el servidor permita CORS. Puede que el canal
              esté caído o requiera un Referer especial.</p></div>`;
      });
    } else {
      v.src = url;
      v.onerror = () => {
        frame.innerHTML = `<div class="no-src"><div class="ic">⚠️</div>
          <h4>Error al reproducir</h4>
          <p>El navegador no pudo cargar este stream. Probá con otro formato o revisá la URL.</p></div>`;
      };
    }
  } else {
    const f = document.createElement('iframe');
    f.src = url;
    f.allowFullscreen = true;
    f.setAttribute('allow','autoplay; fullscreen; encrypted-media; picture-in-picture');
    f.setAttribute('referrerpolicy','no-referrer');
    frame.appendChild(f);
  }
}

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'el-atalaya-tv-config.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('⬇ Configuración exportada');
});

$('#impBtn').addEventListener('click', () => $('#impFile').click());

$('#impFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(data.sources) LS.set('sources', data.sources);
      if(data.custom)  LS.set('custom',  data.custom);
      toast('✅ Importado. Recargando...');
      setTimeout(()=>location.reload(), 800);
    }catch(err){ toast('❌ Archivo inválido'); }
  };
  reader.readAsText(file);
});

  localStorage.removeItem('atalaya_sources');

});

    renderNav(); renderMain();
  }, 220);
});

/* =========================================================
   IPTV — Carga de canales públicos (parser robusto)
   ========================================================= */
const IPTV_FEEDS = [
  { id:'iptv-ar',     label:'🇦🇷 Argentina',  url:'https://raw.githubusercontent.com/elatalayatv-cell/streaming-tv-el-atalaya/refs/heads/main/lista_ar.m3u',     type:'live' },
  { id:'iptv-news',   label:'📰 Noticias',    url:'https://raw.githubusercontent.com/elatalayatv-cell/streaming-tv-el-atalaya/refs/heads/main/lista_news.m3u',   type:'live' },
  { id:'iptv-sports', label:'⚽ Deportes',    url:'https://raw.githubusercontent.com/elatalayatv-cell/streaming-tv-el-atalaya/refs/heads/main/lista_sports.m3u', type:'live' },
  { id:'iptv-music',  label:'🎵 Música',      url:'https://raw.githubusercontent.com/elatalayatv-cell/streaming-tv-el-atalaya/refs/heads/main/lista_music.m3u',  type:'live' },
  { id:'iptv-otros',  label:'📺 Otros',       url:'https://raw.githubusercontent.com/elatalayatv-cell/streaming-tv-el-atalaya/refs/heads/main/lista_otros.m3u',  type:'live' },
  { id:'iptv-movies', label:'🎬 Películas',   url:'https://iptv-org.github.io/iptv/categories/movies.m3u', type:'live' }
];

const iptvOverlay = $('#iptvLoading');
const iptvTitle   = $('#iptvTitle');
const iptvMsg     = $('#iptvMsg');
const iptvBar     = $('#iptvBar');

function showIptvOverlay(show){ iptvOverlay.classList.toggle('show', show); }

async function loadIPTVPlaylist(feed, idx, total){
  try{
    iptvTitle.textContent = '📡 Cargando ' + feed.label + '...';
    iptvMsg.textContent = 'Descargando lista pública... (' + (idx+1) + '/' + total + ')';
    iptvBar.style.width = (idx / total * 100) + '%';

    const res = await fetch(feed.url, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();

    // Split robusto: soporta CRLF, LF y CR
    const lines = text.split(/\r?\n|\r/);
    let current = null;
    const items = [];
    const seen  = new Set();

    for(const rawLine of lines){
      const t = rawLine.trim();
      if(!t) continue;

      if(t.startsWith('#EXTINF:')){
        const groupMatch = t.match(/group-title="([^"]*)"/i);
        const nameAttr   = t.match(/tvg-name="([^"]*)"/i);

        // Obtener el nombre: preferir tvg-name, si no, texto tras la ÚLTIMA coma fuera de comillas
        let name = '';
        if(nameAttr && nameAttr[1].trim()){
          name = nameAttr[1].trim();
        } else {
          let inQuotes = false, lastComma = -1;
          for(let i = 0; i < t.length; i++){
            const ch = t[i];
            if(ch === '"') inQuotes = !inQuotes;
            else if(ch === ',' && !inQuotes) lastComma = i;
          }
          if(lastComma > -1) name = t.substring(lastComma + 1).trim();
        }

        // Descartar basura de User-Agent que se cuela
        if(/Mozilla|Gecko|AppleWebKit|Chrome\/|Safari\/|Firefox\/|KHTML|like\s*Gecko/i.test(name)){
          name = '';
        }
        if(name.length > 70) name = name.substring(0, 67) + '...';
        if(!name) name = 'Canal IPTV';

        current = {
          title: name,
          meta: (groupMatch && groupMatch[1]) ? groupMatch[1].trim() : feed.label
        };

      } else if(t.startsWith('#')){
        // Ignorar #EXTVLCOPT, #EXTGRP, #KODIPROP, #EXTM3U, etc.
        continue;

      } else if(current){
        if(!/^https?:\/\//i.test(t)){ current = null; continue; }

        const key = current.title + '|' + t;
        if(seen.has(key)){ current = null; continue; }
        seen.add(key);

        const id = 'iptv-' + slug(feed.id) + '-' + hash(t).toString(36);
        items.push({ id, title: current.title, meta: current.meta, type: 'live' });
        SOURCES[id] = t;
        current = null;
      }
    }

    // Insertar/actualizar subcategoría en "Canales TV"
    const cat = CATALOG.find(c => c.id === 'canales');
    let sub = cat.subs.find(s => s.id === feed.id);
    if(!sub){
      sub = { id: feed.id, label: feed.label, type: 'live', items: [] };
      cat.subs.push(sub);
    }
    sub.items = items;

    iptvBar.style.width = ((idx+1) / total * 100) + '%';
    return items.length;
  }catch(err){
    console.error('IPTV error:', feed.label, err);
    return 0;
  }
}

async function runIPTVLoad(){
  showIptvOverlay(true);
  let totalCargados = 0;
  for(let i=0; i<IPTV_FEEDS.length; i++){
    const n = await loadIPTVPlaylist(IPTV_FEEDS[i], i, IPTV_FEEDS.length);
    totalCargados += n;
  }
  LS.set('sources', SOURCES);
  LS.set('iptv_loaded', true);
  buildIndex();
  renderNav();
  renderMain();

  iptvTitle.textContent = '✅ ¡Listo!';
  iptvMsg.textContent = totalCargados + ' canales cargados correctamente.';
  iptvBar.style.width = '100%';
  setTimeout(() => {
    showIptvOverlay(false);
    toast('📡 ' + totalCargados + ' canales IPTV cargados');
  }, 900);
}

async function autoLoadIPTV(){
  if(LS.get('iptv_loaded', false)) return;
  await runIPTVLoad();
}

$('#btnIPTV').addEventListener('click', async () => {
  if(!confirm('¿Recargar todos los canales IPTV públicos?\n\nEsto puede tardar unos segundos.')) return;
  LS.set('iptv_loaded', false);
  await runIPTVLoad();
});

/* =========================================================
   INICIO
   ========================================================= */
renderNav();
renderMain();
autoLoadIPTV();
</script>
