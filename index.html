<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0d16;--surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.08);--border:rgba(255,255,255,.08);--text:#f5f7ff;--muted:#7b89ad;--accent:#ffd500;--pink:#ff2d78;--ease:cubic-bezier(.16,1,.3,1);--sidebar-w:280px;--header-h:70px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px;border:2px solid var(--bg)}
::selection{background:rgba(255,213,0,.35);color:#000}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:linear-gradient(180deg,#0d1220,#080b12);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100;transition:transform .35s var(--ease)}
.sidebar-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sidebar-head img{width:44px;height:44px;object-fit:contain;background:linear-gradient(135deg,#ffd500,#ffa500);border-radius:12px;padding:5px;box-shadow:0 6px 18px rgba(255,213,0,.35)}
.sidebar-head h1{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;line-height:1.1;background:linear-gradient(90deg,#fff,#ffd97a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sidebar-head span{font-size:8px;letter-spacing:3px;color:var(--muted);font-weight:700;margin-top:2px;display:block}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 10px 20px}
.sidebar-nav::-webkit-scrollbar{width:5px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,213,0,.25);border-radius:10px}
.cat-title{font-size:9.5px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:12px 14px 8px;font-family:'JetBrains Mono',monospace;opacity:.6}
.cat-btn{position:relative;display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;background:none;border:none;color:#b8c4dc;font-size:12.5px;font-weight:600;font-family:inherit;text-align:left;width:100%;cursor:pointer;transition:.2s var(--ease);margin-bottom:2px}
.cat-btn:hover{background:rgba(255,255,255,.05);color:#fff}
.cat-btn.active{background:linear-gradient(90deg,rgba(255,213,0,.18),rgba(255,165,0,.08));color:#fff;font-weight:700}
.cat-btn.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:linear-gradient(180deg,#ffd500,#ffa500);border-radius:0 3px 3px 0}
.cat-btn .ico{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.cat-btn .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-btn .cnt{font-size:9.5px;font-weight:800;background:rgba(255,255,255,.08);color:#8a94b0;padding:2px 7px;border-radius:999px;font-family:'JetBrains Mono',monospace}
.cat-btn.active .cnt{background:rgba(255,213,0,.25);color:#ffd500}
.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;gap:18px;padding:0 28px;background:rgba(10,13,22,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,213,0,.4),transparent)}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:#fff;cursor:pointer;font-size:16px}
.clock{display:flex;flex-direction:column;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.clock b{font-size:17px;font-weight:700;letter-spacing:-.3px;color:#fff;line-height:1}
.clock small{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.3px;font-weight:500}
.header-title{flex:1;font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:#ffd500;letter-spacing:-.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.hbtn{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:#fff;cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.2s}
.hbtn:hover{background:var(--surface2);transform:translateY(-1px)}
.search-box{position:relative}
.search-box input{width:0;padding:9px 0;opacity:0;background:var(--surface2);border:1px solid var(--border);border-radius:999px;color:#fff;font-size:13px;font-family:inherit;outline:none;transition:.4s var(--ease)}
.search-box.open input{width:260px;padding:9px 14px 9px 38px;opacity:1}
.search-box.open input:focus{border-color:rgba(255,213,0,.5);box-shadow:0 0 0 4px rgba(255,213,0,.08)}
.search-box .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.search-box.open .si{opacity:1}
.content{flex:1;padding:22px 28px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.poster{position:relative;cursor:pointer;transition:transform .35s var(--ease);border-radius:12px;overflow:hidden;background:#0d1220;border:1px solid var(--border)}
.poster:hover{transform:translateY(-6px);border-color:rgba(255,213,0,.5);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 40px rgba(255,213,0,.15);z-index:5}
.poster-img{position:relative;aspect-ratio:2/3;background:radial-gradient(circle at 30% 20%,rgba(255,213,0,.12),transparent 60%),linear-gradient(140deg,#161b28,#0b0f18);display:grid;place-items:center;overflow:hidden}
.poster-img img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s var(--ease)}
.poster:hover .poster-img img{transform:scale(1.08)}
.poster-img .ph{font-size:56px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));transition:.5s var(--ease)}
.poster:hover .poster-img .ph{transform:scale(1.15)}
.poster-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.9) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:14px 12px;z-index:3;pointer-events:none}
.poster-overlay h4{font-size:12.5px;font-weight:700;color:#fff;line-height:1.25;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.poster-overlay .meta{font-size:9.5px;color:#ffd500;font-weight:800;text-transform:uppercase;letter-spacing:.6px;text-shadow:0 2px 6px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster-badge{position:absolute;top:8px;left:8px;z-index:4;background:linear-gradient(135deg,#ff2d78,#ff1744);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:4px;box-shadow:0 4px 12px rgba(255,45,120,.5);text-transform:uppercase}
.poster-badge .dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.poster-fav{position:absolute;top:8px;right:8px;z-index:4;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,13,22,.75);backdrop-filter:blur(10px);color:#b8c4dc;cursor:pointer;font-size:13px;display:grid;place-items:center;transition:.25s;opacity:0;transform:scale(.85)}
.poster:hover .poster-fav{opacity:1;transform:scale(1)}
.poster-fav.on{opacity:1;transform:scale(1);color:#ffd93d;border-color:rgba(255,217,61,.5);background:rgba(255,217,61,.2);box-shadow:0 0 18px rgba(255,217,61,.4)}
.poster-play{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(0,0,0,.5);opacity:0;transition:.3s}
.poster:hover .poster-play{opacity:1}
.poster-play::before{content:'';position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(0,0,0,.7)}
.poster-play span{position:relative;color:#0a0d16;font-size:24px;margin-left:4px}
.load-more{display:block;margin:32px auto 0;padding:14px 40px;background:linear-gradient(135deg,#ffd500,#ffa500);color:#0a0d16;border:none;border-radius:999px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 10px 28px rgba(255,213,0,.4);transition:.3s}
.load-more:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(255,213,0,.55)}
.empty{text-align:center;padding:80px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:18px;background:var(--surface)}
.empty .big{font-size:64px;margin-bottom:14px;opacity:.4;display:block}
.empty h3{color:var(--text);font-size:18px;font-weight:700;margin-bottom:8px}
.loading{position:fixed;inset:0;z-index:900;background:radial-gradient(circle at 30% 30%,rgba(255,213,0,.08),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .4s}
.loading.hidden{opacity:0;pointer-events:none}
.spinner{width:50px;height:50px;border:3px solid rgba(255,213,0,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--muted);font-size:13px;font-family:'JetBrains Mono',monospace}
.modal{position:fixed;inset:0;z-index:500;background:rgba(2,3,8,.97);backdrop-filter:blur(24px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.player-box{width:100%;max-width:1250px;background:linear-gradient(160deg,#0d1019,#08090f);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.95);animation:popIn .4s var(--ease)}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.player-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.player-head h3{font-size:14px;font-weight:700;flex:1;font-family:'Space Grotesk',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-tag{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#ff2d78,#ff1744);color:#fff;font-size:9px;font-weight:800;letter-spacing:1.2px;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.player-stage{background:#000;position:relative;aspect-ratio:16/9;overflow:hidden}
.player-stage video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.pc-close{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:#fff;cursor:pointer;font-size:14px;display:grid;place-items:center}
.pc-close:hover{background:#ff2d78;border-color:#ff2d78}
.pc-controls{position:absolute;left:0;right:0;bottom:0;padding:40px 20px 16px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.92));opacity:0;transition:.3s;pointer-events:none;z-index:10}
.player-stage:hover .pc-controls,.pc-controls.show{opacity:1;pointer-events:auto}
.pc-bar{height:5px;background:rgba(255,255,255,.18);border-radius:999px;cursor:pointer;position:relative;overflow:hidden;margin-bottom:12px;transition:height .2s}
.pc-bar:hover{height:8px}
.pc-played{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,#ffd500,#ffa500);border-radius:999px;box-shadow:0 0 12px rgba(255,213,0,.7)}
.pc-btns{display:flex;align-items:center;gap:8px}
.pc-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.2s;flex-shrink:0}
.pc-btn:hover{background:rgba(255,255,255,.22);transform:scale(1.06)}
.pc-btn.play{width:48px;height:48px;font-size:18px;background:linear-gradient(135deg,#ffd500,#ffa500);border:none;color:#0a0d16;box-shadow:0 6px 20px rgba(255,213,0,.5)}
.pc-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:#fff;font-weight:600;min-width:90px;text-align:center;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:7px;margin-left:8px}
.pc-spacer{flex:1}
.pc-vol{display:flex;align-items:center;gap:8px}
.pc-vol input{width:0;opacity:0;transition:.3s;appearance:none;height:4px;background:rgba(255,255,255,.2);border-radius:999px;outline:none}
.pc-vol:hover input{width:80px;opacity:1}
.pc-vol input::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:linear-gradient(140deg,#0d1019,#08090f);border:1px solid var(--border);border-left:3px solid var(--accent);padding:13px 20px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:1000;opacity:0;transition:.4s var(--ease);box-shadow:0 20px 50px rgba(0,0,0,.8);pointer-events:none;display:flex;align-items:center;gap:10px;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;backdrop-filter:blur(4px)}
.overlay.open{display:block}
.pin-modal{position:fixed;inset:0;z-index:2000;background:rgba(2,3,8,.95);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:20px}
.pin-modal.open{display:flex;animation:fadeIn .2s ease}
.pin-box{width:100%;max-width:360px;background:linear-gradient(160deg,#0d1019,#08090f);border:1px solid var(--border);border-radius:18px;padding:28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.9)}
.pin-box .lock{font-size:56px;margin-bottom:12px;display:block;filter:drop-shadow(0 8px 20px rgba(255,213,0,.4))}
.pin-box h3{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin-bottom:8px;color:#fff}
.pin-box p{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.pin-box input{width:100%;padding:14px 18px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:16px;text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:4px;outline:none;margin-bottom:16px}
.pin-box input:focus{border-color:rgba(255,213,0,.5);box-shadow:0 0 0 4px rgba(255,213,0,.1)}
.pin-box .pin-btns{display:flex;gap:10px}
.pin-box .pin-btn{flex:1;padding:12px;border-radius:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;border:none}
.pin-box .pin-btn.cancel{background:rgba(255,255,255,.06);color:#b8c4dc;border:1px solid var(--border)}
.pin-box .pin-btn.ok{background:linear-gradient(135deg,#ffd500,#ffa500);color:#0a0d16;box-shadow:0 8px 22px rgba(255,213,0,.35)}
.pin-box .pin-btn:hover{transform:translateY(-1px)}
@media(max-width:1000px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:12px 0 40px rgba(0,0,0,.7)}
  .main{margin-left:0}
  .menu-btn{display:grid}
  .content{padding:18px 18px 50px}
  .header{padding:0 18px;gap:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
}
@media(max-width:640px){
  .header-title{display:none}
  .header{padding:0 14px;gap:10px}
  .clock b{font-size:15px}
  .search-box.open input{width:160px;position:absolute;right:46px;top:50%;transform:translateY(-50%);z-index:10}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .poster-overlay h4{font-size:11px}
  .poster-img .ph{font-size:40px}
  .modal{padding:0}
  .player-box{border-radius:0;max-width:100%;max-height:100vh;height:100vh;display:flex;flex-direction:column}
  .player-stage{flex:1;aspect-ratio:auto}
}
</style>
</head>

<div class="loading" id="loading"><div class="spinner"></div><p id="loadTxt">Cargando canales...</p></div>

<div class="app">

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const KEYS = {channels:'atalaya_channels',favorites:'atalaya_favorites',recents:'atalaya_recents',settings:'atalaya_settings'};

const PIN_ADULTOS = '1234';
let adultUnlocked = sessionStorage.getItem('adult_ok') === '1';
let adultosCargados = false;

const PROXY_URL = 'https://elatalayatvoficial.elatalaya.com.ar/proxy?url=';
function proxify(url){
  if(!url) return url;
  if(url.startsWith('https://')) return url;
  if(url.startsWith('blob:') || url.startsWith('data:')) return url;
  return PROXY_URL + encodeURIComponent(url);
}

let channels = [];
let favorites = JSON.parse(localStorage.getItem(KEYS.favorites) || '[]');
let recents = JSON.parse(localStorage.getItem(KEYS.recents) || '[]');
let settings = JSON.parse(localStorage.getItem(KEYS.settings) || '{"volume":80}');
let currentCh = null;
let hls = null;
let currentCat = '__all__';
let currentPage = 0;
const PAGE = 60;

function save(){
  localStorage.setItem(KEYS.favorites, JSON.stringify(favorites));
  localStorage.setItem(KEYS.recents, JSON.stringify(recents));
}
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

let toastT;
function toast(msg, ic='✅'){
  const t = $('#toast');
  t.innerHTML = `<span>${ic}</span> ${msg}`;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 2500);
}

function esCategoriaAdulto(cat){
  return /xxx|adult|porno|\+18|18\+|erotic|hentai/i.test(cat || '');
}

async function loadChannels(){
  try {
    $('#loadTxt').textContent = 'Descargando canales...';
    const response = await fetch('https://elatalayatvoficial.elatalaya.com.ar/channels.json?v=' + Date.now());
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    channels = data.channels || data;
    $('#loadTxt').textContent = '✅ ' + channels.length + ' canales cargados';
    console.log('✅ Canales cargados:', channels.length);
    return true;
  } catch(err){
    console.error('Error:', err);
    $('#loadTxt').innerHTML = '❌ No se pudieron cargar los canales.';
    return false;
  }
}

async function cargarAdultos(){
  if(adultosCargados) return true;
  try {
    const r = await fetch('https://elatalayatvoficial.elatalaya.com.ar/channels-adult.json?v=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const adultos = data.channels || data;
    const ids = new Set(channels.map(c => c.id));
    adultos.forEach(c => { if(!ids.has(c.id)) channels.push(c); });
    adultosCargados = true;
    console.log('🔞 Adultos cargados:', adultos.length);
    return true;
  } catch(err){
    console.error('Error cargando adultos:', err);
    toast('No se pudieron cargar los canales adultos', '⚠️');
    return false;
  }
}

function clock(){
  const n = new Date();
  $('#hTime').textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  const d = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'][n.getDay()];
  const m = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][n.getMonth()];
  $('#hDate').textContent = d + ' ' + n.getDate() + ' ' + m;
}
setInterval(clock, 1000);

function getCategories(){
  const counts = {};
  channels.forEach(c => { if(!counts[c.cat]) counts[c.cat] = 0; counts[c.cat]++; });
  return Object.entries(counts).sort((a,b) => b[1] - a[1]).map(([cat, n]) => ({ cat, n, icon: catIcon(cat) }));
}

function catIcon(cat){
  const c = cat.toLowerCase();
  if(/telenovela|novela/.test(c)) return '💔';
  if(/anime|animaci|animad/.test(c)) return '🌀';
  if(/drama/.test(c)) return '🎭';
  if(/retro/.test(c)) return '📼';
  if(/comedia/.test(c)) return '😂';
  if(/crimen|polici/.test(c)) return '🔍';
  if(/infant|kids|niño/.test(c)) return '🧒';
  if(/ciencia/.test(c)) return '🚀';
  if(/acción|accion/.test(c)) return '💥';
  if(/misterio/.test(c)) return '🕵️';
  if(/terror|thriller|suspenso/.test(c)) return '👻';
  if(/simpsons/.test(c)) return '🍩';
  if(/marvel/.test(c)) return '🦸';
  if(/dc\b|batman/.test(c)) return '🦇';
  if(/star\s*wars/.test(c)) return '⭐';
  if(/harry|potter/.test(c)) return '⚡';
  if(/deport|futbol|fútbol|espn|fox/.test(c)) return '⚽';
  if(/noticia|news|cnn|tn|a24/.test(c)) return '📰';
  if(/music|música/.test(c)) return '🎵';
  if(/document|discovery|natgeo/.test(c)) return '🌎';
  if(/disney/.test(c)) return '🏰';
  if(/relig|igles/.test(c)) return '⛪';
  if(/pluto|samsung|rakuten/.test(c)) return '📺';
  if(/reality|realiti/.test(c)) return '🎤';
  if(/adult|xxx|\+18/.test(c)) return '🔞';
  if(/argentina|arg\b/.test(c)) return '🇦🇷';
  if(/chile/.test(c)) return '🇨🇱';
  if(/mexico|méxico/.test(c)) return '🇲🇽';
  if(/usa/.test(c)) return '🇺🇸';
  if(/españa/.test(c)) return '🇪🇸';
  if(/brasil|brazil/.test(c)) return '🇧🇷';
  if(/francia/.test(c)) return '🇫🇷';
  if(/italia/.test(c)) return '🇮🇹';
  if(/alemania/.test(c)) return '🇩🇪';
  if(/pelic|movie|cine/.test(c)) return '🎬';
  if(/serie|show/.test(c)) return '📽️';
  if(/vod|estreno/.test(c)) return '🎞️';
  return '📺';
}

function buildSidebar(){
  const cats = getCategories();
  let html = `
    <div class="cat-title">INICIO</div>
    <button class="cat-btn ${currentCat==='__all__'?'active':''}" data-cat="__all__">
      <span class="ico">📡</span>
      <span class="lbl">Recientemente agregado</span>
      <span class="cnt">${channels.length}</span>
    </button>
    <button class="cat-btn ${currentCat==='__fav__'?'active':''}" data-cat="__fav__">
      <span class="ico">⭐</span>
      <span class="lbl">Mi lista</span>
      <span class="cnt">${favorites.length}</span>
    </button>`;

  if(!adultUnlocked){
    html += `
    <button class="cat-btn" id="adultBtn" style="margin-top:6px;border:1px dashed rgba(255,45,120,.45);color:#ff6b94;">
      <span class="ico">🔞</span>
      <span class="lbl">Contenido adultos</span>
      <span class="cnt">🔒</span>
    </button>`;
  }

  html += `<div class="cat-title">CATEGORÍAS</div>`;
  
  cats.forEach(({cat, n, icon}) => {
    html += `
      <button class="cat-btn ${currentCat===cat?'active':''}" data-cat="${esc(cat)}">
        <span class="ico">${icon}</span>
        <span class="lbl">${esc(cat)}</span>
        <span class="cnt">${n}</span>
      </button>`;
  });
  
  $('#sidebarNav').innerHTML = html;
  $$('.cat-btn').forEach(btn => {
    if(btn.id === 'adultBtn') return;
    btn.onclick = () => {
      const cat = btn.dataset.cat;
      if(esCategoriaAdulto(cat) && !adultUnlocked){
        pedirPin(() => {
          currentCat = cat;
          currentPage = 0;
          buildSidebar();
          renderContent();
          closeSidebar();
          window.scrollTo({top:0,behavior:'smooth'});
        });
        return;
      }
      currentCat = cat;
      currentPage = 0;
      buildSidebar();
      renderContent();
      closeSidebar();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });

  const adultBtn = $('#adultBtn');
  if(adultBtn){
    adultBtn.onclick = () => {
      pedirPin(() => {
        currentCat = '__all__';
        currentPage = 0;
        buildSidebar();
        renderContent();
        closeSidebar();
        window.scrollTo({top:0,behavior:'smooth'});
      });
    };
  }
}

function pedirPin(callback){
  const modal = $('#pinModal');
  const input = $('#pinInput');
  modal.classList.add('open');
  input.value = '';
  setTimeout(() => input.focus(), 100);

  function limpiar(){
    modal.classList.remove('open');
    $('#pinOk').onclick = null;
    $('#pinCancel').onclick = null;
    input.onkeydown = null;
  }

  async function intentar(){
    if(input.value === PIN_ADULTOS){
      adultUnlocked = true;
      sessionStorage.setItem('adult_ok', '1');
      limpiar();
      toast('🔓 Descargando...', '⏳');
      const ok = await cargarAdultos();
      if(ok){
        toast('🔓 Desbloqueado', '✅');
        buildSidebar();
        callback();
      }
    } else {
      toast('PIN incorrecto', '⛔');
      input.value = '';
      input.focus();
    }
  }

  $('#pinOk').onclick = intentar;
  $('#pinCancel').onclick = limpiar;
  input.onkeydown = e => {
    if(e.key === 'Enter') intentar();
    if(e.key === 'Escape') limpiar();
  };
}

function getFiltered(){
  let list;
  if(currentCat === '__fav__') list = favorites.map(id => channels.find(c => c.id === id)).filter(Boolean);
  else if(currentCat === '__all__') list = channels;
  else list = channels.filter(c => c.cat === currentCat);
  return list;
}

function renderContent(){
  const list = getFiltered();
  let title = 'RECIENTEMENTE AGREGADO';
  if(currentCat === '__fav__') title = '⭐ MI LISTA';
  else if(currentCat !== '__all__') title = catIcon(currentCat) + ' ' + currentCat.toUpperCase();
  $('#viewTitle').textContent = title;
  
  const content = $('#content');
  if(!list.length){
    content.innerHTML = `<div class="empty"><span class="big">📭</span><h3>Sin canales</h3><p>${currentCat === '__fav__' ? 'Agregá canales a tu lista con la estrella ⭐' : 'No hay canales en esta categoría'}</p></div>`;
    return;
  }
  
  const show = list.slice(0, (currentPage + 1) * PAGE);
  content.innerHTML = `
    <div class="grid">${show.map(posterHtml).join('')}</div>
    ${list.length > show.length ? `<button class="load-more" id="loadMore">➕ Ver más (${list.length - show.length} restantes)</button>` : ''}
  `;
  const lm = $('#loadMore');
  if(lm) lm.onclick = () => { currentPage++; renderContent(); };
  bindPosters();
}

function posterHtml(c){
  const logo = c.logo 
    ? `<img src="${esc(c.logo)}" loading="lazy" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=\\'ph\\'>${c.emoji||'📺'}</span>'">` 
    : `<span class="ph">${c.emoji||'📺'}</span>`;
  const isFav = favorites.includes(c.id);
  return `<div class="poster" data-id="${c.id}">
    <div class="poster-img">
      ${logo}
      ${c.live ? '<span class="poster-badge"><span class="dot"></span>LIVE</span>' : ''}
      <button class="poster-fav ${isFav?'on':''}" data-fav="${c.id}">${isFav?'★':'☆'}</button>
      <div class="poster-play"><span>▶</span></div>
    </div>
    <div class="poster-overlay">
      <h4>${esc(c.name)}</h4>
      <div class="meta">${esc(c.cat)}</div>
    </div>
  </div>`;
}

function bindPosters(){
  $$('.poster').forEach(p => {
    p.onclick = e => {
      if(e.target.closest('[data-fav]')) return;
      openPlayer(p.dataset.id);
    };
  });
  $$('[data-fav]').forEach(b => {
    b.onclick = e => { e.stopPropagation(); toggleFav(b.dataset.fav); };
  });
}

function toggleFav(id){
  const i = favorites.indexOf(id);
  if(i > -1){ favorites.splice(i,1); toast('Quitado de Mi lista', '🗑️'); }
  else { favorites.push(id); toast('Agregado a Mi lista', '⭐'); }
  save();
  buildSidebar();
  renderContent();
}

function openPlayer(id){
  const ch = channels.find(c => c.id === id);
  if(!ch) return;
  currentCh = ch;
  $('#pTitle').textContent = ch.name;
  $('#pLive').style.display = ch.live ? 'inline-flex' : 'none';
  
  recents = [ch.id, ...recents.filter(x => x !== ch.id)].slice(0, 20);
  save();
  
  $('#playerModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  
  const video = $('#video');
  if(hls){ hls.destroy(); hls = null; }
  video.pause(); video.removeAttribute('src'); video.load();
  video.muted = true;
  video.autoplay = true;
  
  const finalUrl = proxify(ch.url);
  const isHls = /\.m3u8(\?|$)/i.test(ch.url);
  
  console.log('▶ Reproduciendo:', ch.name);
  console.log('🔗 URL:', ch.url);
  console.log('🛡️ Proxy:', finalUrl);
  
  function startPlay(){
    const p = video.play();
    if(p !== undefined){
      p.then(() => {
        setTimeout(() => {
          video.muted = false;
          video.volume = (settings.volume || 80) / 100;
        }, 300);
      }).catch(err => {
        console.warn('Autoplay bloqueado:', err);
        showBigPlay(video);
      });
    }
  }
  
  if(isHls && window.Hls && Hls.isSupported()){
    hls = new Hls({ enableWorker: true, lowLatencyMode: true, maxBufferLength: 30 });
    hls.loadSource(finalUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, startPlay);
    hls.on(Hls.Events.ERROR, (e, data) => {
      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      }
    });
  } else {
    video.src = finalUrl;
    video.addEventListener('loadeddata', startPlay, { once: true });
    startPlay();
  }
  
  showControls();
}

function showBigPlay(video){
  const old = document.getElementById('bigPlay');
  if(old) old.remove();
  const btn = document.createElement('div');
  btn.id = 'bigPlay';
  btn.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);cursor:pointer;z-index:20;';
  btn.innerHTML = '<div style="width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#ffd500,#ffa500);display:grid;place-items:center;box-shadow:0 20px 60px rgba(255,213,0,.6);"><span style="color:#0a0d16;font-size:40px;margin-left:8px;">▶</span></div>';
  btn.onclick = () => {
    video.muted = false;
    video.volume = (settings.volume || 80) / 100;
    video.play().catch(()=>{});
    btn.remove();
  };
  $('#pStage').appendChild(btn);
  video.addEventListener('play', () => btn.remove(), { once: true });
}

function closePlayer(){
  const v = $('#video');
  v.pause();
  if(hls){ hls.destroy(); hls = null; }
  v.removeAttribute('src'); v.load();
  const big = document.getElementById('bigPlay');
  if(big) big.remove();
  $('#playerModal').classList.remove('open');
  document.body.style.overflow = '';
  currentCh = null;
}

let ctrlT;
function showControls(){
  $('#pControls').classList.add('show');
  clearTimeout(ctrlT);
  ctrlT = setTimeout(() => { if(!$('#video').paused) $('#pControls').classList.remove('show'); }, 3000);
}

$('#pStage').addEventListener('mousemove', showControls);
$('#pStage').addEventListener('click', e => {
  if(e.target.closest('.pc-controls') || e.target.closest('#bigPlay')) return;
  const v = $('#video');
  v.paused ? v.play() : v.pause();
});
$('#pcPlay').onclick = () => { const v = $('#video'); v.paused ? v.play() : v.pause(); };
$('#video').addEventListener('play', () => $('#pcPlay').textContent = '⏸');
$('#video').addEventListener('pause', () => $('#pcPlay').textContent = '▶');
$('#pcBack').onclick = () => { $('#video').currentTime -= 10; };
$('#pcFwd').onclick = () => { $('#video').currentTime += 10; };
$('#pcBar').addEventListener('click', e => {
  const v = $('#video');
  if(!v.duration) return;
  const r = $('#pcBar').getBoundingClientRect();
  v.currentTime = ((e.clientX - r.left) / r.width) * v.duration;
});

setInterval(() => {
  const v = $('#video');
  if(!v.duration || !isFinite(v.duration)) return;
  $('#pcPlayed').style.width = (v.currentTime / v.duration) * 100 + '%';
  $('#pcTime').textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
}, 500);

function fmt(s){
  if(!s || !isFinite(s)) return '00:00';
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

$('#pcVol').oninput = e => { $('#video').volume = e.target.value/100; settings.volume = parseInt(e.target.value); localStorage.setItem(KEYS.settings, JSON.stringify(settings)); updateVolIcon(); };
$('#pcMute').onclick = () => { const v = $('#video'); v.muted = !v.muted; updateVolIcon(); };
function updateVolIcon(){ const v = $('#video'); $('#pcMute').textContent = (v.muted || v.volume === 0) ? '🔇' : v.volume < 0.5 ? '🔉' : '🔊'; }

$('#pcFull').onclick = () => { const el = $('#pStage'); if(!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.(); };
$('#pClose').onclick = closePlayer;
$('#playerModal').onclick = e => { if(e.target.id === 'playerModal') closePlayer(); };

$('#searchBtn').onclick = () => {
  const w = $('#searchWrap');
  w.classList.toggle('open');
  if(w.classList.contains('open')) $('#searchInput').focus();
};

$('#searchInput').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if(!q){ renderContent(); return; }
  const m = channels.filter(c => c.name.toLowerCase().includes(q) || c.cat.toLowerCase().includes(q)).slice(0, 200);
  $('#viewTitle').textContent = `🔍 "${e.target.value}"`;
  const content = $('#content');
  if(!m.length){
    content.innerHTML = '<div class="empty"><span class="big">🔍</span><h3>Sin resultados</h3></div>';
    return;
  }
  content.innerHTML = `<div class="grid">${m.map(posterHtml).join('')}</div>`;
  bindPosters();
});

function closeSidebar(){
  if(window.innerWidth <= 1000){
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('open');
  }
}
$('#menuBtn').onclick = () => {
  $('#sidebar').classList.toggle('open');
  $('#overlay').classList.toggle('open');
};
$('#overlay').onclick = closeSidebar;

document.addEventListener('keydown', e => {
  if(!$('#playerModal').classList.contains('open')) return;
  if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
  const v = $('#video');
  if(e.key === ' '){ e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if(e.key === 'ArrowLeft') v.currentTime -= 10;
  else if(e.key === 'ArrowRight') v.currentTime += 10;
  else if(e.key.toLowerCase() === 'm'){ v.muted = !v.muted; updateVolIcon(); }
  else if(e.key.toLowerCase() === 'f') $('#pcFull').click();
  else if(e.key === 'Escape') closePlayer();
});

(async () => {
  clock();
  const ok = await loadChannels();
  if(ok){
    if(adultUnlocked) await cargarAdultos();
    buildSidebar();
    renderContent();
    console.log(`✅ ${channels.length} canales · ${getCategories().length} categorías`);
    setTimeout(() => $('#loading').classList.add('hidden'), 400);
  }
})();
</script>
